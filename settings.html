<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings</title>
<style>
:root{--ac:#4cc9f0;--bg:#0b0e17;--pn:#141926;--p2:#1c2333;--ln:rgba(255,255,255,.08);--tx:#e9edf5;--mt:#8b95a9;--gl:rgba(16,20,32,.66)}
body.light{--bg:#eef1f7;--pn:#fff;--p2:#eef1f8;--ln:rgba(0,0,0,.1);--tx:#16202e;--mt:#5b667a;--gl:rgba(255,255,255,.74)}
body.hc{--bg:#000;--pn:#000;--p2:#111;--ln:#ff0;--tx:#fff;--mt:#ff0;--ac:#0ff;--gl:#000}
*{box-sizing:border-box}
body{margin:0;height:100vh;overflow:hidden;user-select:none;color:var(--tx);font:13.5px "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;background:var(--bg);display:flex}
textarea,input{user-select:text}

.sb{width:260px;padding:16px 12px;background:var(--pn);overflow:auto;flex:none;border-right:1px solid var(--ln)}
.pf{display:flex;gap:12px;align-items:center;padding:8px 10px 20px}
.av{width:46px;height:46px;border-radius:50%;background:var(--ac);color:#001018;display:grid;place-items:center;font-size:22px;font-weight:700}
.nv{display:flex;gap:12px;align-items:center;padding:10px 14px;border-radius:8px;cursor:pointer;position:relative;margin-bottom:2px}
.nv:hover,.nv.on{background:var(--p2)}
.nv.on::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:3px;background:var(--ac)}
.sm{flex:1;overflow:auto;padding:24px 32px}
.sm h1{margin:0 0 20px;font-size:28px;font-weight:600}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:10px;margin-bottom:16px;overflow:hidden}
.card h3{margin:0;padding:18px 20px 6px;font-size:18px;font-weight:600}
.sub{padding:0 20px 16px;color:var(--mt)}.pad{padding:16px 20px}
.rw{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 20px;border-top:1px solid var(--ln)}
.rw.lk{cursor:pointer}.rw.lk:hover{background:var(--p2)}.rw small{display:block;color:var(--mt);margin-top:4px}
.sw{width:44px;height:24px;border-radius:12px;border:1px solid var(--mt);position:relative;cursor:pointer;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:4px;width:16px;height:16px;border-radius:50%;background:var(--mt);transition:.2s}
.sw.on{background:var(--ac);border-color:var(--ac)}.sw.on::after{left:24px;background:#001018}
.bar{height:4px;background:var(--ln);margin:14px 0 18px;border-radius:2px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.wps{display:grid;grid-template-columns:repeat(3,minmax(100px, 1fr));gap:10px;padding:16px 20px}
.wp{height:90px;border-radius:8px;cursor:pointer;border:2px solid transparent;background-size:cover!important;background-position:center!important}.wp.sel{border-color:var(--ac)}
.hh{display:flex;align-items:center;gap:20px;margin-bottom:24px}
.thumb{width:140px;height:80px;border-radius:8px;border:2px solid var(--ln);background-size:cover!important;background-position:center!important}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;align-items:start}

button{background:var(--p2);color:var(--tx);border:1px solid var(--ln);border-radius:6px;padding:6px 14px;cursor:pointer;font:inherit}
button:hover{border-color:var(--ac)}
button.pri{background:var(--ac);color:#001018;border-color:transparent;font-weight:600}
input[type=text],input[type=password],input[type=color],select{background:var(--p2);color:var(--tx);border:1px solid var(--ln);border-radius:6px;padding:8px 12px;font:inherit;outline:none}
input[type=text]:focus,input[type=password]:focus{border-color:var(--ac)}
input[type=range]{accent-color:var(--ac)}
.mt{color:var(--mt)}
a{color:var(--ac);cursor:pointer}
</style>
</head>
<body>
<div class="sb" id="snav"></div>
<div class="sm" id="sm"></div>

<script>
let ipcRenderer, shell, fs, os, path, webUtils;
try {
  const electron = require('electron');
  ipcRenderer = electron.ipcRenderer;
  shell = electron.shell;
  webUtils = electron.webUtils;
  fs = require('fs');
  os = require('os');
  path = require('path');
} catch (e) {}

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = b => {
  if (b >= 1e9) return (b / 1e9).toFixed(1) + ' GB';
  if (b >= 1e6) return (b / 1e6).toFixed(1) + ' MB';
  return Math.max(1, Math.round(b / 1e3)) + ' KB';
};

const HOME = os ? os.homedir() : "C:\\";
const NOTES = path ? path.join(HOME, 'Documents', 'AI OS', 'Notes') : '';
const WP = [
  'radial-gradient(circle at 30% 20%,#1b3cff,#07091a 70%)',
  'linear-gradient(135deg,#d9e4f5,#8fa8d0)',
  'linear-gradient(180deg,#9ecbd0,#2d5f6d)',
  'radial-gradient(circle at 70% 80%,#c026d3,#1a0524 65%)',
  'linear-gradient(120deg,#f6d9c8,#a4b8d6)',
  'conic-gradient(from 200deg at 50% 60%,#0a1f44,#1fb6a6,#7a3cff,#0a1f44)'
];

let localS = {};
try { localS = JSON.parse(localStorage.aios || '{}'); } catch(e) {}
const S = Object.assign({
  name: 'User',
  email: '',
  dev: (os && os.hostname) ? os.hostname() : 'PC',
  wp: 0,
  img: '',
  mode: 'dark',
  accent: '#4cc9f0',
  bright: 100,
  h24: false,
  bt: true,
  hc: false,
  vol: 80,
  mic: 50,
  pin: '1234',
  bio: true,
  ainame: 'Jarvis',
  aivoice: 'female',
  aicolor: '#4cc9f0',
  aiavatar: 'orb',
  aianim: 'rotate'
}, localS);

let pg = 'ai';

function applyTheme() {
  document.documentElement.style.setProperty('--ac', S.accent);
  document.body.classList.toggle('light', S.mode === 'light');
  document.body.classList.toggle('hc', S.hc);
}

function set(k, v, re) {
  S[k] = v;
  try { localStorage.aios = JSON.stringify(S); } catch(e) {}
  applyTheme();

  // Notify parent index.html immediately
  try {
    if (window.parent && typeof window.parent.syncSettings === 'function') {
      window.parent.syncSettings();
    }
  } catch(e) {}

  // Send AI parameter updates to backend via IPC
  if (ipcRenderer) {
    ipcRenderer.send('ai-config', {
      vol: S.vol,
      mic: S.mic,
      voice: S.aivoice,
      name: S.ainame
    });
  }

  if (re && pg) go(pg);
}

const setWp = i => { S.wp = i; S.img = ''; set('wp', i, 1); };
function pickImg(e) {
  const f = e.target.files[0];
  if (!f) return;
  let imgPath = URL.createObjectURL(f);
  if (webUtils && webUtils.getPathForFile) imgPath = webUtils.getPathForFile(f);
  else if (f.path) imgPath = f.path;
  set('img', imgPath, 1);
}

const disk = () => {
  if (!fs || !HOME) return null;
  try {
    const s = fs.statfsSync(HOME);
    return { t: s.blocks * s.bsize, u: (s.blocks - s.bavail) * s.bsize };
  } catch(e) { return null; }
};

const T = k => `<span class="sw ${S[k] ? 'on' : ''}" onclick="set('${k}', S.${k} ? false : true, 1)"></span>`;
const R = (l, c = '', s = '', a = '') => `<div class="rw ${a ? 'lk' : ''}" ${a ? `onclick="${a}"` : ''}><div>${l}${s ? `<small>${s}</small>` : ''}</div>${c}</div>`;
const CH = '<span class="mt">›</span>';
const card = (h, b, s) => `<div class="card">${h ? `<h3>${h}</h3>` : ''}${s ? `<div class="mt sub">${s}</div>` : ''}${b}</div>`;
const sl = (k, a, b) => `<input type="range" min="${a}" max="${b}" value="${S[k]}" oninput="set('${k}',+this.value)">`;
const tx = (k, ph = '') => `<input type="text" value="${esc(S[k])}" placeholder="${ph}" oninput="set('${k}',this.value.trim(),0)">`;
const sel = (k, opts) => `<select onchange="set('${k}',this.value,1)">${opts.map(o => `<option value="${o[0]}" ${S[k]===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select>`;
const wall = () => `<div class="wps">${WP.map((w, i) => `<div class="wp ${S.wp == i && !S.img ? 'sel' : ''}" style="background:${w}" onclick="setWp(${i})"></div>`).join('')}</div>`;

const mode = () => {
  let opts = ['dark', 'light'];
  let selectHTML = `<select onchange="set('mode',this.value,1)">`;
  opts.forEach(m => {
    selectHTML += `<option ${S.mode === m ? 'selected' : ''} value="${m}">${m[0].toUpperCase() + m.slice(1)}</option>`;
  });
  return selectHTML + `</select>`;
};

const NAV = [
  ['home', '🏠', 'Home'],
  ['system', '🖥️', 'System'],
  ['bt', '🔵', 'Bluetooth & devices'],
  ['net', '📶', 'Network & internet'],
  ['pers', '🎨', 'Personalization'],
  ['sec', '🔒', 'Privacy & security'],
  ['acc', '👤', 'Accounts'],
  ['time', '🕒', 'Time & language'],
  ['ai', '🎙️', 'AI assistant']
];

const P = {
  home: () => {
    const d = disk();
    const pc = d ? Math.round(d.u / d.t * 100) : 0;
    let p_os = os ? os.platform() : 'OS';
    let cpus = (os && os.cpus) ? os.cpus() : null;
    let p_cpu = (cpus && cpus[0] && cpus[0].model) ? esc(cpus[0].model) : 'CPU';
    return `<h1>Home</h1>
    <div class="hh"><div class="thumb" style="background:${WP[S.wp]}"></div><div style="flex:1"><b style="font-size:17px">${esc(S.dev)}</b><div class="mt">${p_os}, ${p_cpu}</div><a onclick="go('system')">Rename</a></div><div>${navigator.onLine ? '📶 <b>Wi-Fi</b><div class="mt">Connected</div>' : '⚠️ <b>Offline</b>'}</div></div>
    <div class="cols"><div>
      ${card('Recommended settings', R('Display', CH, '', "go('system')") + R('Security options', CH, '', "go('sec')") + R('Contrast themes', T('hc')), 'Recent and commonly used settings')}
      ${card('Personalize your device', wall() + R('Color mode', mode()) + R('Browse themes', CH, '', "go('pers')"))}
    </div><div>
      ${card('Storage', `<div class="pad">${d ? `<b>${fmt(d.u)}</b> used of ${fmt(d.t)} (${pc}%)<div class="bar"><i style="width:${pc}%"></i></div>` : ''}</div>` + R('Saved notes', '<span class="mt">Open</span>', 'Documents\\AI OS\\Notes', 'shell ? shell.openPath(NOTES) : null'), 'Device storage summary.')}
    </div></div>`;
  },
  system: () => {
    const d = disk();
    let cpus = (os && os.cpus) ? os.cpus() : null;
    let p_cpu = (cpus && cpus[0] && cpus[0].model) ? esc(cpus[0].model) : '';
    let p_ram = os ? fmt(os.totalmem()) : '';
    let p_sys = os ? os.type() + ' ' + os.release() : '';
    return `<h1>System</h1>
    ${card('Display', R('Brightness', '', ' ') + `<div class="pad" style="padding-top:0">${sl('bright', 30, 100)}</div>`)}
    ${card('Device name', R('Name', tx('dev')))}
    ${card('Storage', R('Disk usage', d ? `<span>${fmt(d.u)} of${fmt(d.t)}</span>` : 'Unavailable'))}
    ${card('About', R('AI OS', 'v2.0 (Electron)') + R('Processor', p_cpu) + R('Installed RAM', p_ram) + R('System', p_sys))}`;
  },
  bt: () => `<h1>Bluetooth & devices</h1>${card('', R('Bluetooth', T('bt')))}`,
  net: () => {
    const c = navigator.connection || {};
    return `<h1>Network & internet</h1>${card('', R('Status', navigator.onLine ? '<b style="color:#2ecc71">Connected</b>' : '<b style="color:#e5484d">Disconnected</b>') + R('Connection type', c.effectiveType || 'Unknown') + R('Estimated speed', (c.downlink ? c.downlink + ' Mbps' : 'Unknown')))}`;
  },
  pers: () => `<h1>Personalization</h1>${card('Background', wall() + R('Use your own picture', `<button onclick="$('wpi').click()">Choose image</button><input id="wpi" type="file" accept="image/*" hidden onchange="pickImg(event)">`))}${card('Colors', R('Color mode', mode()) + R('Accent color', `<input type="color" value="${S.accent}" onchange="set('accent',this.value,1)">`) + R('Contrast themes', T('hc')))}`,
  sec: () => `<h1>Privacy & security</h1>
    ${card('Sign-in options',
      R('System Password / PIN', `<input type="password" value="${esc(S.pin)}" id="pin-in" style="width:140px"><button onclick="savePin()" style="margin-left:8px">Update</button>`, 'Used for boot-up splash & login screen') +
      R('Windows Hello / Biometrics', T('bio'), 'Allow logging in with Fingerprint or Face ID when supported')
    )}
    ${card('Security Status', `<div class="pad"><span style="color:#2ecc71">● Protected</span> - AI OS Vault Active</div>`)}`,
  acc: () => `<h1>Accounts</h1>${card('Your info', R('Name', tx('name')) + R('Email', tx('email', 'you@example.com')))}`,
  time: () => `<h1>Time & language</h1>${card('', R('24-hour clock', T('h24')))}`,
  ai: () => `<h1>AI assistant</h1>
    ${card('Identity & Core', 
        R('Assistant Name', tx('ainame', 'e.g. Jarvis'), 'Wake word and subtitle display identity.') + 
        R('AI Color Theme', `<input type="color" value="${S.aicolor}" onchange="set('aicolor',this.value,1)">`, 'Glow and accent colour of the orb.')
    )}
    ${card('Appearance & Animation', 
        R('Avatar Design', sel('aiavatar', [['orb','Energy Orb'],['puppy','Puppy 🐶'],['kitten','Kitten 🐱'],['male','Human (Male) 👨'],['female','Human (Female) 👩']]), 'Choose the core shape.') +
        R('Idle Animation', sel('aianim', [['static','Static (No Movement)'],['rotate','Core Rotation'],['blink','Pulsing Blink'],['circle','Circular Orbit']]), 'Visual movement profile.')
    )}
    ${card('Voice & Hardware Control', 
        R('Voice Type', sel('aivoice', [['female','Female'],['male','Male']]), 'Select male or female speech synthesizer.') +
        R('Voice volume', sl('vol', 1, 100)) + 
        R('Microphone sensitivity', sl('mic', 1, 100))
    )}`
};

function savePin() {
  const p = $('pin-in').value.trim();
  if (!p) return;
  set('pin', p, 1);
  alert('Lock screen PIN/Password updated successfully.');
}

function go(p) {
  pg = p;
  let accName = S.name ? S.name : 'User';
  let accEmail = S.email ? S.email : 'Local account';
  $('snav').innerHTML = `<div class="pf"><div class="av">${esc(accName[0].toUpperCase())}</div><div><b>${esc(accName)}</b><div class="mt">${esc(accEmail)}</div></div></div>` +
    NAV.map(n => `<div class="nv ${n[0] === p ? 'on' : ''}" onclick="go('${n[0]}')">${n[1]} ${n[2]}</div>`).join('');
  $('sm').innerHTML = P[p]();
}

applyTheme();
go('ai');
</script>
</body>
</html>
